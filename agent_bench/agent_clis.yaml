# Complete coding-agent CLI registry for agent_bench.
# default_model for all harnesses: ThinkingCap-Qwen3.6-27B-MLX-4bit (models.yaml).

default_model: t-prazak/ThinkingCap-Qwen3.6-27B-MLX-4bit
default_base_url: http://localhost:8080/v1

agents:
  # ── Group 1 — Frontier lab CLIs ───────────────────────────────────────────
  - id: claude-code
    group: frontier-lab
    vendor: anthropic
    binary: claude
    pier_agent: claude-code
    harness_tier: A
    bench_enabled: true
    headless: "claude -p"
    model_routing: anthropic_compatible
    default_model: t-prazak/ThinkingCap-Qwen3.6-27B-MLX-4bit
    prereqs: []  # local ThinkingCap via ANTHROPIC_BASE_URL
    install: "npm i -g @anthropic-ai/claude-code"
    notes: "Route through localhost:8080 (Kevlar/LiteLLM) so Claude Code hits ThinkingCap"

  - id: codex
    group: frontier-lab
    vendor: openai
    binary: codex
    pier_agent: codex
    harness_tier: A
    bench_enabled: true
    headless: "codex -p"
    model_routing: openai_compatible
    default_model: t-prazak/ThinkingCap-Qwen3.6-27B-MLX-4bit
    prereqs: []
    install: "npm i -g @openai/codex"

  - id: cursor-cli
    group: frontier-lab
    vendor: cursor
    binary: cursor-agent
    pier_agent: cursor-cli
    harness_tier: A
    bench_enabled: true
    headless: "cursor-agent -p"
    model_routing: openai_compatible
    default_model: t-prazak/ThinkingCap-Qwen3.6-27B-MLX-4bit
    prereqs: []
    install: "curl https://cursor.com/install | bash"

  - id: opencode
    group: frontier-lab
    vendor: anomaly
    binary: opencode
    pier_agent: opencode
    harness_tier: A
    bench_enabled: true
    headless: "opencode"
    model_routing: openai_compatible
    default_model: t-prazak/ThinkingCap-Qwen3.6-27B-MLX-4bit
    prereqs: []
    install: "npm i -g opencode"

  - id: grok-build
    group: frontier-lab
    vendor: xai
    binary: grok
    harness_tier: B
    bench_enabled: true
    headless: "grok -p"
    model_routing: openai_compatible
    default_model: t-prazak/ThinkingCap-Qwen3.6-27B-MLX-4bit
    prereqs: [XAI_API_KEY]
    install: "curl -fsSL https://x.ai/cli/install.sh | bash"

  - id: antigravity
    group: frontier-lab
    vendor: google
    binary: agy
    harness_tier: B
    bench_enabled: true
