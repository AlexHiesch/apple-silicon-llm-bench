    model_routing: openai_compatible
    default_model: t-prazak/ThinkingCap-Qwen3.6-27B-MLX-4bit
    prereqs: [GITHUB_COPILOT_TOKEN]
    install: "npm i -g @github/copilot"

  - id: mimo-code
