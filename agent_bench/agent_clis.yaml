thinkingcap_matrix:
  description: Curated agents for ThinkingCap-Qwen3.6-27B-MLX-4bit comparison (user shortlist Jul 2026)
  include:
  - claude-code
  - cline
  - codex
  - command-code
  - cursor-cli
  - gdevelop
  - goose
  - hermes-agent
  - kilocode
  - lemonade
  - mimo-code
  - oh-my-pi
  - openclaw
  - opencode
  - openhands
  - opensquilla
  - peezy
  - pi
  - poolside
  - portkey
  - zed
  skip:
  - ito
  - roo-code
  notes:
  - Roo Code EOL → skip; Zoo Code is the community fork (watch-only, not primary).
  - Ito explicitly skipped.
  - Lemonade / GDevelop / Zed / Portkey are platforms/editors/gateways — included for breadth, smoke differs.
  - 'Already green on ThinkingCap smoke: claude-code, opencode, goose, hermes-agent, codex, kilocode,
    mimo-code, cursor-cli (BYOK).'
