# Coding-agent CLI registry for agent_bench.
# default_model: ThinkingCap-Qwen3.6-27B-MLX-4bit (models.yaml).
#
# matrix field per agent:
#   include — curated ThinkingCap shortlist (Jul 2026)
#   skip    — explicitly out (Roo EOL, Ito, …)
#   out     — registered but not on the shortlist
#
# Filter: python -m agent_bench.run_matrix --list --matrix
#      or: agents where matrix == include

