  # Group DG — DiffusionGemma 26B-A4B (Block Diffusion, MoE)
  # Architecture: DiffusionGemmaForBlockDiffusion — 26B MoE (3.8B active / 25.2B total)
  #   Uses discrete diffusion with block-autoregressive multi-canvas sampling:
  #   generates 256-token blocks in parallel via iterative denoising, NOT
  #   standard autoregressive token-by-token generation.
  # Claims: up to 4x faster inference (1000+ tok/s on H100, 700+ on RTX 5090)
  # Native context: 256K tokens (sliding window 1024 + global attention)
  # Memory budget: same as Gemma4 26B A4B (~13 GB weights at 4bit + KV)
  # HuggingFace: google/diffusiongemma-26B-A4B-it (Apache 2.0)
  # mlx-community models: diffusiongemma-26B-A4B-it-4bit, -8bit, -5bit, -6bit,
  #   -mxfp4, -mxfp8, -nvfp4, -bf16
  # GGUF: unsloth/diffusiongemma-26B-A4B-it-GGUF (Q4_K_M, Q5_K_M, Q6_K, Q8_0)
  # Backend support:
  #   mlx-vlm 0.6.0+ — supports diffusion_gemma model type (block diffusion decoding)
  #   vLLM (GPU) — supports diffusion decoding via OpenAI-compat API
  #   llama.cpp — DRAFT PR #24423 only, no server mode yet (llama-diffusion-cli only)
  #   Ollama — NOT supported (depends on llama.cpp merge)
  # NOTE: llama.cpp GGUF quants exist but standard llama-server cannot run them
  #   with diffusion decoding. Only llama-diffusion-cli (from PR #24423) works.
  # ══════════════════════════════════════════════════════════════════════════════

