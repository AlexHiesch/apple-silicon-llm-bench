  # ══════════════════════════════════════════════════════════════════════════════
  # Group NC — North Mini Code 1.0 (Cohere, MoE 30B-A3B, Agentic Coding)
  # Architecture: cohere2_moe — 30B MoE (3B active / 30B total)
  #   128 experts, 8 active per token. Interleaved sliding-window + global
  #   attention (3:1 ratio). SwiGLU FFN. Sigmoid-gated router.
  # Context: 128K tokens (trained Stage 1 @ 64K, Stage 2 @ 128K)
  # License: Apache 2.0
  # Purpose: agentic software engineering — SWE-Bench 80.2% pass@10,
  #   outperforms Qwen3.5-35B-A3B, Gemma4-26B-A4B on Artificial Analysis
  #   Coding Index (33.4). Direct competitor to Group A/O/B.
  # Memory budget: ~18 GB weights (4bit) + KV. Very similar to Qwen3.5 35B-A3B.
  # HuggingFace: CohereLabs/North-Mini-Code-1.0
  # mlx-community: North-Mini-Code-1.0-4bit, -5bit, -6bit, -bf16
  # GGUF: unsloth/North-Mini-Code-1.0-GGUF (UD-Q4_K_M ~19 GB, UD-Q4_K_XL ~19 GB,
  #   UD-Q2_K_XL ~10 GB, Q8_0 ~32 GB, MXFP4_MOE ~19 GB)
